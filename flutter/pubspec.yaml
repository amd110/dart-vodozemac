name: flutter_vodozemac_plus
description: "Flutter bindings for the Rust Vodozemac Plus library"
version: 0.6.1+1
repository: https://github.com/amd110/dart-vodozemac


environment:
  sdk: ^3.6.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: any
  plugin_platform_interface: ^2.0.2
  vodozemac_plus: ^0.6.1+2


dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
